# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: ./runs/train/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4
prefetch_factor: null
persistent_workers: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
save_final_checkpoint: true
eval_every: 50
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# checkpoint loading
#
# `checkpoint.resume_from` is for exact resume from an Accelerate state
# directory. It restores model/optimizer/scheduler/dataloader progress and is
# intended for same-config continuation.
#
# `checkpoint.init_from_weights` only loads the model weights from a `.pt`
# checkpoint. Use this path when continuing from trained weights while changing
# training hyperparameters such as learning_rate, max_steps, batch_size, or
# gradient_accumulation_steps.
checkpoint:
  resume_from: null
  init_from_weights: null
  load_step_from_weights: false
  initial_step: null
  advance_scheduler_to_step: true
  save_full_state: true
  require_full_state: true
  weight_min_free_gb: 30
  full_state_min_free_gb: 120
  keep_last_full_states: 2

# optional timing/profiling; disabled by default to keep training semantics and speed unchanged
profile:
  enabled: false
  warmup_steps: 20
  sync_cuda: true
  output_jsonl: null
  torch_profiler:
    enabled: false
    wait: 1
    warmup: 1
    active: 3
    repeat: 1
    record_shapes: true
    profile_memory: true
    with_stack: false
    write_trace: true
    trace_dir: null
    table_path: null
    sort_by: self_cuda_time_total
    row_limit: 80
    group_by_input_shape: false

# optional WAM self-rollout diagnostic; disabled by default and never writes official GEMBench preds
open_loop_wam_eval:
  enabled: false
  every: 2000
  num_samples: 1
  rollout_chunks: 4
  chunk_stride: 32
  num_inference_steps: ${eval_num_inference_steps}
  seed: 42
  save_video: true
  video_fps: 8
  max_wandb_videos: 1
  fail_on_error: false
  tiled: false

# wandb
wandb:
  enabled: false
  workspace: null
  project: fast-wam
  name: train
  group: null
  job_type: train
  tags: []
  subproject: null
  mode: online
  id: null
  resume: null

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
