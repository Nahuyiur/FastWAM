train:
  _target_: fastwam.datasets.robocasa365.acg_video_dataset.RoboCasa365ACGVideoDataset
  dataset_dirs:
    - /mnt/pub_dataset/RoboCasa365/repos/robocasa365-pretrain-atomic
  episode_manifest_path: /mnt/pub_dataset/RoboCasa365/splits/robocasa_acg_v1_episode_manifest.csv
  episode_manifest_split: train_id
  shape_meta:
    images:
      - key: robot0_agentview_left
        raw_shape: [3, 224, 224]
        shape: [3, 224, 224]
      - key: robot0_eye_in_hand
        raw_shape: [3, 224, 224]
        shape: [3, 224, 224]
    action:
      - key: default
        raw_shape: 12
        shape: 12
    state:
      - key: default
        raw_shape: 16
        shape: 16
  num_frames: 9
  action_horizon: 32
  frame_offsets: [0, 4, 8, 12, 16, 20, 24, 28, 32]
  video_size: [224, 448]
  camera_keys:
    - robot0_agentview_left
    - robot0_eye_in_hand
  concat_multi_camera: horizontal
  window_stride: 2
  is_training_set: true
  pretrained_norm_stats: /mnt/yuhan/experiments/robocasa_acg_v1/fastwam/cache/norm_stats/robocasa_acg_v1_train_id_dataset_stats.json
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.action_horizon}
    num_output_cameras: 2
    action_output_dim: 12
    proprio_output_dim: 16
    delta_action_dim_mask:
      default: [false, false, false, false, false, false, false, false, false, false, false, false]
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms: null
    val_transforms: null
  text_embedding_cache_dir: /mnt/yuhan/experiments/robocasa_acg_v1/fastwam/cache/text_embeds/robocasa_acg_v1
  context_len: 128
  text_encoder_id: wan22ti2v5b
  allow_missing_text_embeds: false
  video_backend: pyav
  tolerance_s: 0.04

val:
  _target_: fastwam.datasets.robocasa365.acg_video_dataset.RoboCasa365ACGVideoDataset
  dataset_dirs: ${data.train.dataset_dirs}
  episode_manifest_path: ${data.train.episode_manifest_path}
  episode_manifest_split: val_id
  shape_meta: ${data.train.shape_meta}
  num_frames: ${data.train.num_frames}
  action_horizon: ${data.train.action_horizon}
  frame_offsets: ${data.train.frame_offsets}
  video_size: ${data.train.video_size}
  camera_keys: ${data.train.camera_keys}
  concat_multi_camera: ${data.train.concat_multi_camera}
  window_stride: 4
  is_training_set: false
  pretrained_norm_stats: ${data.train.pretrained_norm_stats}
  processor: ${data.train.processor}
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  context_len: ${data.train.context_len}
  text_encoder_id: ${data.train.text_encoder_id}
  allow_missing_text_embeds: false
  video_backend: ${data.train.video_backend}
  tolerance_s: ${data.train.tolerance_s}
