# @package _global_

defaults:
  - override /data: robocasa_acg_v1_2cam224_train
  - override /model: fastwam_joint
  - _self_

batch_size: 1
num_workers: 2
prefetch_factor: 2
persistent_workers: true

lr_scheduler_type: cosine
learning_rate: 5.0e-5
num_epochs: 5
max_steps: 50000
log_every: 20
save_every: 5000
eval_every: 2000
eval_num_inference_steps: 10

# 1 sample/rank * 8 ranks * 4 accumulation = effective batch 32.
gradient_accumulation_steps: 4
weight_decay: 1.0e-2
mixed_precision: bf16
resume: null

model:
  mot_checkpoint_mixed_attn: true
  redirect_common_files: false
  skip_dit_load_from_pretrain: false
  action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt

checkpoint:
  weight_min_free_gb: 30
  full_state_min_free_gb: 160
  keep_last_full_states: 2

wandb:
  enabled: true
  workspace: null
  project: robocasa-acg-fastwam
  name: robocasa-acg-v1-fastwam-8gpu
  group: robocasa-acg-v1
  mode: online
  tags: [robocasa365, acg-v1, fastwam, jinshan-cwm8]
