# @package _global_

defaults:
  - override /data: rlbench_3cam
  - override /model: fastwam
  - _self_

# dataloading
batch_size: 2
num_workers: 4

data:
  train:
    variant_type: original
  val:
    variant_type: original

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 1  # unused when max_steps is set
max_steps: 50000
log_every: 10
save_every: 2000
eval_every: 2000
eval_num_inference_steps: 10

# training
mixed_precision: bf16
gradient_accumulation_steps: 2
weight_decay: 1e-2
optimizer_foreach: false
optimizer_fused: true
resume: null
