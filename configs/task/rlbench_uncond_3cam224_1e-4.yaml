# @package _global_

defaults:
  - override /data: rlbench_3cam
  - override /model: fastwam
  - _self_

# dataloading
batch_size: 2
num_workers: 4

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 1000
eval_every: 1000
eval_num_inference_steps: 10

# training
mixed_precision: bf16
gradient_accumulation_steps: 2
weight_decay: 1e-2
optimizer_foreach: false
optimizer_fused: true
resume: null
